<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Realistic Keyboards - Windows13</title>
<style>
:root {
  --neon: #00ff41;
  --yellow: #ffe600;
  --panel-bg: rgba(0, 15, 5, 0.96);
  --key-bg: #141414;
  --key-hover: #242424;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #000;
  color: var(--neon);
  font-family: "Courier New", monospace;
  padding: 16px;
  min-height: 100vh;
}
.keyboard-window {
  background: var(--panel-bg);
  border: 3px solid var(--neon);
  border-radius: 16px;
  padding: 18px;
  max-width: 1040px;
  margin: 0 auto;
  box-shadow: 0 0 40px rgba(0,255,65,0.18);
}
.kb-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1px solid rgba(0,255,65,0.3);
}
.kb-title { font-size: 1.25rem; color: var(--yellow); text-shadow: 0 0 10px var(--yellow); }
.kb-sub { font-size: 0.8rem; opacity: 0.85; }
.kb-controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
.kb-select, .kb-btn {
  background: #000;
  color: var(--neon);
  border: 2px solid var(--neon);
  padding: 9px 12px;
  border-radius: 6px;
  font-family: inherit;
  font-size: 0.92rem;
}
.kb-select { flex: 1; min-width: 220px; }
.kb-btn { cursor: pointer; font-weight: bold; }
.kb-btn:hover, .kb-toggle:hover { background: var(--neon); color: #000; }
.kb-toggle {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px;
  border: 1px solid var(--neon);
  border-radius: 6px;
  cursor: pointer;
}
.kb-output {
  background: #000;
  border: 2px solid var(--neon);
  border-radius: 8px;
  padding: 16px 14px 12px;
  min-height: 88px;
  margin-bottom: 10px;
  font-size: 1.2rem;
  white-space: pre-wrap;
  word-break: break-word;
  position: relative;
}
.kb-output-label {
  position: absolute; top: -10px; left: 14px;
  background: var(--panel-bg); padding: 0 8px;
  font-size: 0.72rem; color: var(--yellow);
}
.autocomplete-bar {
  display: none; gap: 8px; overflow-x: auto;
  margin-bottom: 10px; padding: 6px;
  border: 1px solid rgba(0,255,65,0.35); border-radius: 6px;
}
.autocomplete-bar.active { display: flex; }
.suggestion {
  background: rgba(0,255,65,0.12);
  border: 1px solid var(--neon);
  color: var(--neon);
  padding: 6px 10px;
  border-radius: 4px;
  cursor: pointer;
  white-space: nowrap;
}
.suggestion:hover { background: var(--neon); color: #000; }
.keyboard {
  display: flex; flex-direction: column; gap: 7px;
  padding: 14px; background: rgba(0,0,0,0.45); border-radius: 12px;
}
.kb-row { display: flex; gap: 6px; justify-content: center; }
.key {
  background: var(--key-bg);
  border: 2px solid var(--neon);
  border-radius: 6px;
  color: var(--neon);
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  user-select: none;
  display: flex; align-items: center; justify-content: center;
  min-width: 42px; height: 48px; padding: 4px 6px;
  box-shadow: 0 2px 0 #062;
  position: relative;
}
.key small {
  position: absolute; top: 3px; left: 5px;
  font-size: 0.62rem; color: var(--yellow); font-weight: 700;
}
.key:hover { background: var(--key-hover); transform: translateY(-1px); }
.key.down, .key:active {
  transform: translateY(1px);
  background: var(--neon); color: #000; box-shadow: none;
}
.key.down small { color: #222; }
.key.special { border-color: var(--yellow); color: var(--yellow); background: rgba(255,230,0,0.08); }
.key.modifier { border-color: #0af; color: #0af; font-size: 0.78rem; background: rgba(0,100,255,0.1); }
.key.latched { background: rgba(0,255,65,0.28); }
.key.w15 { min-width: 62px; }
.key.w17 { min-width: 72px; }
.key.w20 { min-width: 86px; }
.key.w23 { min-width: 104px; }
.key.space { min-width: 280px; }
.status { margin-top: 10px; font-size: 0.78rem; opacity: 0.8; }
.copy-notification {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0);
  background: rgba(0,255,65,0.95); color: #000;
  padding: 16px 28px; border-radius: 12px; font-weight: bold;
  z-index: 20; transition: transform 0.2s;
}
.copy-notification.show { transform: translate(-50%, -50%) scale(1); }
@media (max-width: 760px) {
  .key { min-width: 28px; height: 40px; font-size: 0.78rem; }
  .key.space { min-width: 120px; }
  .key.w23 { min-width: 64px; }
}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">

function deviceLocale() {
  return (navigator.languages && navigator.languages[0]) || navigator.language || "en";
}

function layoutForLocale(locale) {
  const tag = String(locale || "en").toLowerCase();
  const hit = DEVICE_MAP.find(([prefix]) => tag === prefix || tag.startsWith(prefix + "-"));
  return hit ? hit[1] : "us";
}

  kana: true,
  auto: localStorage.getItem("w13kb-auto") === "1",
  follow: localStorage.getItem("w13kb-follow") !== "0"
};

const keyboardEl = document.getElementById("keyboard");
const outputEl = document.getElementById("output");
const outputBox = document.getElementById("outputBox");
const statusEl = document.getElementById("status");
const bar = document.getElementById("autocompleteBar");
const select = document.getElementById("layoutSelect");

function glyph(key) {
  if (key.action) return key.label;
  const base = key[0];
  const shifted = key[1] || key[0];
  if (state.layout === "japanese") {
    if (state.kana) return state.shift ? base : shifted;
    return state.shift ? base.toUpperCase() : base;
  }
  const letter = base.toLowerCase() !== base.toUpperCase() && base.toLowerCase() === base;
  if (state.shift) return shifted;
  if (state.caps && letter) return base.toUpperCase();
  return base;
}

function renderSelect() {
  const groups = {};
  Object.entries(LAYOUTS).forEach(([id, layout]) => {
    (groups[layout.group] ||= []).push([id, layout.name]);
  });
  select.innerHTML = "";
  Object.entries(groups).forEach(([name, items]) => {
    const og = document.createElement("optgroup");
    og.label = name;
    items.forEach(([id, label]) => {
      const opt = document.createElement("option");
      opt.value = id;
      opt.textContent = label;
      if (id === state.layout) opt.selected = true;
      og.appendChild(opt);
    });
    select.appendChild(og);
  });
}

function renderKeyboard() {
  const layout = LAYOUTS[state.layout];
  keyboardEl.innerHTML = "";
  outputBox.dir = layout.rtl ? "rtl" : "ltr";
  layout.rows.forEach(row => {
    const rowEl = document.createElement("div");
    rowEl.className = "kb-row";
    row.forEach(key => {
      const el = document.createElement("button");
      el.type = "button";
      el.className = "key " + (key.cls || "");
      if (key.action === "shift" && state.shift) el.classList.add("latched");
      if (key.action === "caps" && state.caps) el.classList.add("latched");
      if (key.action === "kana" && state.kana) el.classList.add("latched");
      if (key.id) el.dataset.id = key.id;
      const shown = glyph(key);
      if (!key.action && key[1] && key[1] !== key[0]) {
        const sub = document.createElement("small");
        sub.textContent = state.shift ? key[0] : key[1];
        el.appendChild(sub);
      }
      el.appendChild(document.createTextNode(shown));
      el.addEventListener("click", () => press(key));
      rowEl.appendChild(el);
    });
    keyboardEl.appendChild(rowEl);
  });
  const locale = deviceLocale();
  const alphabet = layout.alphabet || (layout.rtl ? "arabic" : "latin");
  const note = layout.note ? " · " + layout.note : "";
  const alt = layout.alt ? " · AltGr diacritics on a c e l n o s x z" : "";
  const kana = state.layout === "japanese" ? (state.kana ? " · alphabet hiragana" : " · alphabet latin") : " · alphabet " + alphabet;
  statusEl.textContent = layout.name + (state.caps ? " · CAPS" : "") + (state.shift ? " · SHIFT" : "") + kana + note + alt;
  document.getElementById("deviceLine").textContent = "Device " + locale + " → " + LAYOUTS[layoutForLocale(locale)].name + (state.follow ? " · following" : " · manual");
}

function insert(ch) {
  state.text += ch;
  if (state.shift) state.shift = false;
  persist();
}

function press(key) {
  if (key.action === "backspace") state.text = state.text.slice(0, -1);
  else if (key.action === "space") insert(" ");
  else if (key.action === "enter") insert("\n");
  else if (key.action === "tab") insert("\t");
  else if (key.action === "shift") state.shift = !state.shift;
  else if (key.action === "caps") state.caps = !state.caps;
  else if (key.action === "kana") state.kana = true;
  else if (key.action === "eisu") state.kana = false;
  else if (key.action === "char") insert(key.ch);
  else if (key.action === "noop") return;
  else insert(glyph(key));
  persist();
}

function persist() {
  localStorage.setItem("w13kb-text", state.text);
  localStorage.setItem("w13kb-layout", state.layout);
  localStorage.setItem("w13kb-follow", state.follow ? "1" : "0");
  outputEl.textContent = state.text;
  renderKeyboard();
  updateAutocomplete();
}

function updateAutocomplete() {
  if (!state.auto) { bar.classList.remove("active"); return; }
  const parts = state.text.split(/\s/);
  const last = (parts[parts.length - 1] || "").toLowerCase();
  const hits = last ? WORDS.filter(w => w.startsWith(last) && w !== last).slice(0, 6) : [];
  bar.innerHTML = "";
  if (!hits.length) { bar.classList.remove("active"); return; }
  hits.forEach(word => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "suggestion";
    b.textContent = word;
    b.addEventListener("click", () => {
      parts[parts.length - 1] = word;
      state.text = parts.join(" ");
      persist();
    });
    bar.appendChild(b);
  });
  bar.classList.add("active");
}

function flash(id) {
  const el = keyboardEl.querySelector('[data-id="' + id + '"]');
  if (!el) return;
  el.classList.add("down");
  setTimeout(() => el.classList.remove("down"), 90);
}

document.addEventListener("keydown", (e) => {
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.target.tagName === "TEXTAREA")) return;
  if (e.key === "Shift") { state.shift = true; renderKeyboard(); return; }
  if (e.key === "CapsLock") { state.caps = !state.caps; renderKeyboard(); return; }
  if (e.key === "Backspace") { e.preventDefault(); state.text = state.text.slice(0, -1); flash("Backspace"); persist(); return; }
  if (e.key === "Enter") { e.preventDefault(); insert("\n"); flash("Enter"); return; }
  if (e.key === " ") { e.preventDefault(); insert(" "); flash("Space"); return; }
  if (e.key === "Tab") { e.preventDefault(); insert("\t"); flash("Tab"); return; }
  if (e.altKey && LAYOUTS[state.layout].alt) {
    const hit = LAYOUTS[state.layout].alt[e.key];
    if (hit) { e.preventDefault(); insert(hit); return; }
  }
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
    e.preventDefault();
    insert(e.key);
  }
});
document.addEventListener("keyup", (e) => {
  if (e.key === "Shift") { state.shift = false; renderKeyboard(); }
});

select.addEventListener("change", () => {
  state.layout = select.value;
  state.follow = false;
  document.getElementById("followDevice").checked = false;
  persist();
});
document.getElementById("followDevice").checked = state.follow;
document.getElementById("followDevice").addEventListener("change", (e) => {
  state.follow = e.target.checked;
  if (state.follow) state.layout = layoutForLocale(deviceLocale());
  persist();
  renderSelect();
});
document.getElementById("autocompleteToggle").checked = state.auto;
document.getElementById("autocompleteToggle").addEventListener("change", (e) => { state.auto = e.target.checked; persist(); });
document.getElementById("copyBtn").addEventListener("click", async () => {
  if (!state.text) return;
  await navigator.clipboard.writeText(state.text);
  const n = document.getElementById("copyNotif");
  n.classList.add("show");
  setTimeout(() => n.classList.remove("show"), 1200);
});
document.getElementById("clearBtn").addEventListener("click", () => { state.text = ""; persist(); });

if (state.follow) state.layout = layoutForLocale(deviceLocale());
renderSelect();
persist();
</script>
</body>
</html>
